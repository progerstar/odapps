[package]
name = "wdtmon-rs"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "USB WatchDog monitor over HID (egui rewrite of the Qt wdtmon3-mini)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
eframe = "0.37"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
auto-launch = "0.6"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.18"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
