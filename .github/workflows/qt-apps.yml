name: qt-apps

on:
  push:
    branches:
      - main
    tags:
      - "qt-apps-v*"
    paths:
      - "qt/**"
      - ".github/workflows/qt-apps.yml"
  pull_request:
    paths:
      - "qt/**"
      - ".github/workflows/qt-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suite_version: ${{ steps.version.outputs.suite_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and application versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source qt/scripts/apps.sh

          suite_version=snapshot
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            suite_version="${GITHUB_REF_NAME#qt-apps-v}"
            if [[ "$suite_version" == "$GITHUB_REF_NAME" ||
                  ! "$suite_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must have the form qt-apps-v1.2.3" >&2
              exit 1
            fi
          fi
          echo "suite_version=$suite_version" >> "$GITHUB_OUTPUT"

          {
            echo "### Qt application versions"
            echo
            for app in "${ALL_APP_NAMES[@]}"; do
              echo "- \`$app\`: $(app_version "$GITHUB_WORKSPACE/qt" "$app")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    name: Linux x86-64 AppImages
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qt
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt 5 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl desktop-file-utils file \
            libqt5serialbus5-dev libqt5serialport5-dev libqt5svg5-dev \
            libudev-dev libusb-1.0-0-dev patchelf \
            qml-module-qt-labs-calendar qml-module-qt-labs-platform \
            qml-module-qt-labs-settings qml-module-qtgraphicaleffects qml-module-qtquick-controls \
            qml-module-qtquick-controls2 qml-module-qtquick-extras \
            qml-module-qtquick-layouts qml-module-qtquick-window2 \
            qml-module-qtquick2 qtbase5-dev qtbase5-private-dev \
            qtdeclarative5-dev qtdeclarative5-dev-tools \
            qtquickcontrols2-5-dev qttools5-dev-tools

      - name: Install pinned AppImage tools
        shell: bash
        run: |
          set -euo pipefail
          appimagetool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          runtime="$RUNNER_TEMP/runtime-x86_64"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  '"$appimagetool" \
            | sha256sum --check --strict
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  '"$runtime" \
            | sha256sum --check --strict
          chmod 0755 "$appimagetool"
          echo "APPIMAGETOOL=$appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME_FILE=$runtime" >> "$GITHUB_ENV"

      - name: Run source tests
        shell: bash
        run: ./scripts/test-linux.sh

      - name: Build Linux packages
        shell: bash
        env:
          SKIP_TARBALL: "1"
        run: ./scripts/package-linux.sh

      - name: Verify Linux checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/linux
          for checksum in *.sha256; do
            sha256sum --check --strict "$checksum"
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt-apps-linux-x86_64
          path: qt/dist/linux/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows x86-64 ZIP packages
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve Unix line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSYS2 and Qt 5
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            file
            make
            zip
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-declarative
            mingw-w64-ucrt-x86_64-qt5-graphicaleffects
            mingw-w64-ucrt-x86_64-qt5-quickcontrols
            mingw-w64-ucrt-x86_64-qt5-quickcontrols2
            mingw-w64-ucrt-x86_64-qt5-serialbus
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-qt5-translations

      - name: Build Windows packages
        shell: msys2 {0}
        working-directory: qt
        env:
          QMAKE: qmake-qt5
          MAKE: mingw32-make
          WDEPLOYQT: windeployqt-qt5
        run: ./scripts/package-windows-native.sh

      - name: Verify Windows checksums
        shell: msys2 {0}
        working-directory: qt
        run: |
          set -euo pipefail
          cd dist/windows
          for checksum in *.sha256; do
            sha256sum --check --strict "$checksum"
          done

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt-apps-windows-x86_64
          path: qt/dist/windows/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS ${{ matrix.package_arch }} DMG packages
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            package_arch: arm64
          - runner: macos-15-intel
            package_arch: x86_64
    defaults:
      run:
        working-directory: qt
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt 5 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install bash libusb pkgconf qt@5
          qt_prefix="$(brew --prefix qt@5)"
          bash_prefix="$(brew --prefix bash)"
          libusb_prefix="$(brew --prefix libusb)"
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"
          echo "$bash_prefix/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$libusb_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            >> "$GITHUB_ENV"
          echo "LIBUSB_ROOT=$libusb_prefix" >> "$GITHUB_ENV"

      - name: Build macOS packages
        shell: bash
        env:
          MACOS_ARCH: ${{ matrix.package_arch }}
        run: '"$(brew --prefix bash)/bin/bash" ./scripts/package-macos.sh'

      - name: Verify macOS checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/macos
          for checksum in *.sha256; do
            shasum -a 256 --check "$checksum"
          done

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt-apps-macos-${{ matrix.package_arch }}
          path: qt/dist/macos/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/qt-apps-v')
    needs:
      - metadata
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: qt-apps-*
          path: release-assets
          merge-multiple: true

      - name: Verify packages and create manifests
        shell: bash
        env:
          SUITE_VERSION: ${{ needs.metadata.outputs.suite_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          checksums=(release-assets/*.sha256)
          if ((${#checksums[@]} == 0)); then
            echo "No package checksums were downloaded" >&2
            exit 1
          fi

          (
            cd release-assets
            for checksum in *.sha256; do
              sha256sum --check --strict "$checksum" >&2
            done
            cat -- *.sha256 | LC_ALL=C sort -k2 > qt-apps-SHA256SUMS.txt
          )

          source qt/scripts/apps.sh
          {
            echo "Qt applications bundle: $SUITE_VERSION"
            echo "Git commit: $GITHUB_SHA"
            echo
            for app in "${ALL_APP_NAMES[@]}"; do
              printf '%s %s\n' "$app" "$(app_version "$GITHUB_WORKSPACE/qt" "$app")"
            done
          } > release-assets/qt-apps-versions.txt

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_VERSION: ${{ needs.metadata.outputs.suite_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if ((${#assets[@]} == 0)); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "OpenDev Qt applications $SUITE_VERSION"
          fi
