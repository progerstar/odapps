name: rust-app

# Reusable build of one Rust application in rust/<app>/ (egui): checks, tests on
# every platform, AppImage / ZIP / DMG packages and, for a <app>-v<version> tag,
# its own GitHub Release. Called by odrfid-tool-modbus.yml and wdtmon-rs.yml.
# Packaging lives in rust/scripts/package.sh, metadata in rust/scripts/apps.sh.

on:
  workflow_call:
    inputs:
      app:
        description: Application folder and binary name under rust/
        required: true
        type: string

env:
  # Pinned so a new Rust release cannot change the build or fail clippy.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  APP: ${{ inputs.app }}

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the version and the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source rust/scripts/apps.sh
          require_app "$APP"
          version="$(app_version "$APP")"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag_version="${GITHUB_REF_NAME#"$APP"-v}"
            if [[ "$tag_version" == "$GITHUB_REF_NAME" || "$tag_version" != "$version" ]]; then
              echo "The tag must be $APP-v$version (rust/$APP/Cargo.toml has $version)" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$APP $version" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Format and clippy
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: rust/${{ inputs.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libudev-dev pkg-config

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy -c rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: ${{ matrix.platform }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the AppImage compatible with older glibc.
          - runner: ubuntu-22.04
            platform: linux-x86_64
            package: linux
          - runner: windows-2022
            platform: windows-x86_64
            package: windows
            # Static CRT: no Visual C++ redistributable needed. Set for the
            # tests too, so the package build reuses their dependencies.
            rustflags: -C target-feature=+crt-static
          - runner: macos-15
            platform: macos-arm64
            package: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos-x86_64
            package: macos
            arch: x86_64
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve Unix line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            desktop-file-utils file libudev-dev pkg-config

      - name: Install pinned AppImage tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          appimagetool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          runtime="$RUNNER_TEMP/runtime-x86_64"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  '"$appimagetool" \
            | sha256sum --check --strict
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  '"$runtime" \
            | sha256sum --check --strict
          chmod 0755 "$appimagetool"
          echo "APPIMAGETOOL=$appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME_FILE=$runtime" >> "$GITHUB_ENV"

      - name: Install bash 5
        # The packaging script needs associative arrays; macOS ships bash 3.2.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Run tests
        working-directory: rust/${{ inputs.app }}
        run: cargo test --locked

      - name: Build and package
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: bash rust/scripts/package.sh "$APP" "${{ matrix.package }}"

      - name: Verify the checksum
        working-directory: rust/dist
        run: |
          set -euo pipefail
          for checksum in *.sha256; do
            if command -v sha256sum >/dev/null; then
              sha256sum --check --strict "$checksum"
            else
              shasum -a 256 --check "$checksum"
            fi
          done

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app }}-${{ matrix.platform }}
          path: |
            rust/dist/${{ inputs.app }}-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, format('refs/tags/{0}-v', inputs.app))
    needs:
      - metadata
      - lint
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.app }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify the packages and write the checksum list
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-assets
          checksums=(*.sha256)
          if ((${#checksums[@]} != 4)); then
            echo "Expected 4 platform packages, got ${#checksums[@]}: ${checksums[*]}" >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            sha256sum --check --strict "$checksum" >&2
          done
          cat -- "${checksums[@]}" | LC_ALL=C sort -k2 > "$APP-SHA256SUMS.txt"
          rm -- "${checksums[@]}"
          ls -l

      - name: Write the release notes
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          source rust/scripts/apps.sh
          description="${APP_DESCRIPTIONS[$APP]}"
          docs="${APP_DOCS[$APP]}"
          cat > release-notes.md <<NOTES
          $APP $VERSION — $description.
          Instructions: $docs

          | Platform | File |
          | --- | --- |
          | Windows x86-64 | \`$APP-$VERSION-windows-x86_64.zip\` |
          | macOS, Apple silicon | \`$APP-$VERSION-macos-arm64.dmg\` |
          | macOS, Intel | \`$APP-$VERSION-macos-x86_64.dmg\` |
          | Linux x86-64 (built on Ubuntu 22.04) | \`$APP-$VERSION-linux-x86_64.AppImage\` |

          The files are not code-signed.

          - Windows: unpack the archive and run \`$APP.exe\`. If SmartScreen stops it, choose "More info",
            then "Run anyway".
          - macOS: open the image and drag the application to Applications. If macOS refuses to open it,
            allow it in System Settings, Privacy & Security, or clear the quarantine:
            \`xattr -dr com.apple.quarantine /Applications/$APP.app\`.
          - Linux: \`chmod +x $APP-$VERSION-linux-x86_64.AppImage\` and run it.
          - Check the download: \`sha256sum --check --ignore-missing $APP-SHA256SUMS.txt\`
            (macOS: \`shasum -a 256 --check --ignore-missing $APP-SHA256SUMS.txt\`).
          NOTES
          cat release-notes.md

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if ((${#assets[@]} == 0)); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            # --latest=false: the site links the Qt applications through releases/latest/download/...,
            # so "Latest" must stay on the newest qt-apps-v* release.
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest=false \
              --title "$APP $VERSION" \
              --notes-file release-notes.md
          fi

      - name: Check that "Latest" stays on the Qt applications
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "Latest release: $latest"
          if [[ "$latest" == "$APP"-v* ]]; then
            echo "::error::$latest became the Latest release: releases/latest/download links of the Qt applications are broken." \
                 "Restore it with: gh release edit <newest qt-apps-v tag> --latest" >&2
            exit 1
          fi
