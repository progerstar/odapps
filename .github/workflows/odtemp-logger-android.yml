name: ODTemp Logger Android

on:
  push:
    paths: ["android/odtemp-logger/**", ".github/workflows/odtemp-logger-android.yml"]
  pull_request:
    paths: ["android/odtemp-logger/**", ".github/workflows/odtemp-logger-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/odtemp-logger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: odtemp-logger-debug
          path: |
            android/odtemp-logger/app/build/outputs/apk/debug/*.apk
            android/odtemp-logger/app/build/reports/tests/testDebugUnitTest/
            android/odtemp-logger/app/build/reports/lint-results-debug.html
